version: "3.8"

services:
  # AMD64/x86_64 architecture
  livox_driver:
    build:
      context: .
      dockerfile: Dockerfile
    image: livox_ros2_driver:humble-amd64
    container_name: livox_ros2_driver
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./config:/ros2_ws/src/livox_ros_driver2/config:rw
    environment:
      - ROS_DOMAIN_ID=0
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch livox_ros_driver2 rviz_MID360_launch.py"

  # ARM64/aarch64 architecture (for Jetson, Raspberry Pi, etc.)
  livox_driver_arm:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: livox_ros2_driver:humble-arm64
    container_name: livox_ros2_driver_arm
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./config:/ros2_ws/src/livox_ros_driver2/config:rw
    environment:
      - ROS_DOMAIN_ID=0
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch livox_ros_driver2 rviz_MID360_launch.py"
